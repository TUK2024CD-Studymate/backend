version: '3.8'

services:
  redis:
    container_name: redis
    image: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - study_mate

  back-end:
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
    container_name: study-mate
    restart: always
    depends_on:
      - redis
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    networks:
      - study_mate

volumes:
  mariadb_data:

networks:
  study_mate:
    driver: bridge
